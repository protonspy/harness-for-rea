name: CI

# The gate a pull request must pass before it merges into main, which branch protection requires
# (plans/ci-pr-gate.md). It runs on pull requests only: main takes no change any other way.
on:
  pull_request:

permissions:
  contents: read

# One run per pull request: a newer push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's code runs here: it gets no token left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run typecheck && npm run build
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: node scripts/test-gate.mjs
